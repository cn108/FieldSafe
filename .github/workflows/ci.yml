name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Tests mock the YOLO model, so the heavy ultralytics/torch install is skipped.
      - name: Install test dependencies
        run: |
          pip install "Django>=5.2,<6.0" "djangorestframework>=3.16,<4.0" \
            "djangorestframework-simplejwt>=5.5,<6.0" "django-cors-headers>=4.7,<5.0" \
            "opencv-python-headless>=4.10,<5.0" numpy
      - name: Check configuration and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test reports

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check app.js
          node --check sw.js
